name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: dart pub get (arena_engine)
        if: hashFiles('packages/arena_engine/pubspec.yaml') != ''
        working-directory: packages/arena_engine
        run: dart pub get

      # Warnings are reported but not fatal until lane 2 removes the
      # pre-existing unused _goldGradient (see docs/requests.md).
      # Errors and lints still fail the job.
      - name: flutter analyze
        run: flutter analyze --no-fatal-warnings

      - name: flutter test
        run: flutter test

      - name: dart test (arena_engine)
        if: hashFiles('packages/arena_engine/pubspec.yaml') != ''
        working-directory: packages/arena_engine
        run: dart test

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter build apk --debug
        run: flutter build apk --debug

      - name: Check application ID and target SDK
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          badging="$("$aapt" dump badging build/app/outputs/flutter-apk/app-debug.apk)"
          echo "$badging" | grep -E "^(package|targetSdkVersion|application-label):"
          echo "$badging" | grep -q "^package: name='games.oneear.catpawsarena'"
          target="$(echo "$badging" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")"
          test "$target" -ge 36
          echo "$badging" | grep -q "^application-label:'Cat Paws Arena'"

      - name: Families policy (no AD_ID, no ad or analytics SDKs)
        run: .github/scripts/check_families_policy.sh build/app/outputs/flutter-apk/app-debug.apk

      - name: No APK is tracked
        run: |
          if git ls-files | grep -iE '\.(apk|aab)$'; then
            echo "APK/AAB files must not be committed." >&2
            exit 1
          fi
